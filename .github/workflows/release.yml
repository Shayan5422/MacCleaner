name: Release

# Builds a universal, Developer ID–signed and notarized release and publishes it on GitHub.
#
#   • Push a tag "vX.Y.Z" whose version matches MARKETING_VERSION in project.yml and has a
#     "## [X.Y.Z]" section in CHANGELOG.md  →  a GitHub release with the DMG, zip and SHA-256 file.
#   • Run it by hand (Actions › Release › Run workflow) to get the same build as a workflow
#     artifact; tick "publish" to also create the release and its tag.
#
# Signing and notarization need repository secrets (see docs/RELEASING.md and
# scripts/setup-release-secrets.sh). Without them a manual run still builds an ad-hoc signed
# app for testing, but nothing is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (and create its tag) after building"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize and publish
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      REQUIRED_XCODE_MAJOR: "27"
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || '244735TY4Y' }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.app ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_27.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR=/Applications/Xcode_27.app/Contents/Developer
          fi
          # Read the whole output: piping into head makes xcodebuild crash with SIGPIPE.
          version_output="$(xcodebuild -version)"
          version="$(printf '%s\n' "$version_output" | awk 'NR == 1 { print $2 }')"
          echo "Using Xcode $version"
          if [ "${version%%.*}" -lt "$REQUIRED_XCODE_MAJOR" ]; then
            echo "::error title=Xcode too old::Mac Cleaner needs Xcode $REQUIRED_XCODE_MAJOR or later, but this runner has Xcode $version."
            exit 1
          fi

      - name: Read version and release notes
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' project.yml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Mac Cleaner $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version in project.yml."
            exit 1
          fi
          if ! scripts/release-notes.sh "$version" > "$RUNNER_TEMP/release-notes.md"; then
            echo "::error title=No release notes::CHANGELOG.md has no \"## [$version]\" section."
            exit 1
          fi

      - name: Check signing secrets
        id: secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          API_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          signing=false; notary=none
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ]; then signing=true; fi
          if [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER" ]; then notary=api-key
          elif [ -n "$APPLE_ID" ] && [ -n "$APP_PASSWORD" ]; then notary=apple-id
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "notary=$notary" >> "$GITHUB_OUTPUT"
          echo "Developer ID signing: $signing · notarization: $notary"
          if [ "$PUBLISH" = "true" ] && { [ "$signing" != "true" ] || [ "$notary" = "none" ]; }; then
            echo "::error title=Signing secrets missing::Publishing needs DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD and notarization credentials. Run scripts/setup-release-secrets.sh (see docs/RELEASING.md)."
            exit 1
          fi
          if [ "$signing" != "true" ]; then
            echo "::notice title=Unsigned build::No signing secrets, so this run builds an ad-hoc signed app for testing only."
          fi

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project MacCleaner.xcodeproj -scheme MacCleaner -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData-tests \
            test 2>&1 | tee build/xcodebuild-test.log | grep -E '(Test run with|error:|✘)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' build/xcodebuild-test.log

      - name: Import the Developer ID certificate
        if: steps.secrets.outputs.signing == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" || {
            echo "::error title=No Developer ID identity::The .p12 doesn't contain a Developer ID Application certificate with its private key."
            exit 1
          }
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare notarization credentials
        if: steps.secrets.outputs.notary != 'none' && steps.secrets.outputs.signing == 'true'
        env:
          API_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY: ${{ steps.secrets.outputs.notary }}
        run: |
          set -euo pipefail
          if [ "$NOTARY" = "api-key" ]; then
            printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_ARGS=--notary-key $RUNNER_TEMP/AuthKey.p8 --notary-key-id $API_KEY_ID --notary-issuer $API_ISSUER" >> "$GITHUB_ENV"
          else
            xcrun notarytool store-credentials MacCleanerCI --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
              --password "$APP_PASSWORD" --keychain "$KEYCHAIN" > /dev/null
            echo "NOTARY_ARGS=--notary-profile MacCleanerCI" >> "$GITHUB_ENV"
          fi

      - name: Build, sign and notarize
        if: steps.secrets.outputs.signing == 'true'
        env:
          NOTARY: ${{ steps.secrets.outputs.notary }}
        run: |
          set -euo pipefail
          if [ "$NOTARY" = "none" ]; then
            scripts/release.sh --team "$TEAM_ID" --keychain "$KEYCHAIN" --skip-notarization
          else
            # shellcheck disable=SC2086 # NOTARY_ARGS is a list of options
            scripts/release.sh --team "$TEAM_ID" --keychain "$KEYCHAIN" $NOTARY_ARGS
          fi

      - name: Build an ad-hoc signed app (no signing secrets)
        if: steps.secrets.outputs.signing != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -quiet -project MacCleaner.xcodeproj -scheme MacCleaner -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData-release build
          mkdir -p build/release
          artifact="Mac-Cleaner-$VERSION-unsigned"
          ditto -c -k --keepParent "build/DerivedData-release/Build/Products/Release/Mac Cleaner.app" "build/release/$artifact.zip"
          (cd build/release && shasum -a 256 "$artifact.zip" > "$artifact.sha256")

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: mac-cleaner-${{ steps.version.outputs.version }}
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        if: env.PUBLISH == 'true' && steps.secrets.outputs.signing == 'true' && steps.secrets.outputs.notary != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          files=(build/release/Mac-Cleaner-"$VERSION".dmg build/release/Mac-Cleaner-"$VERSION".zip build/release/Mac-Cleaner-"$VERSION".sha256)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "Mac Cleaner $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"
          fi
          echo "### Published [Mac Cleaner $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
